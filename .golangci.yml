version: "2"

run:
  timeout: 5m

linters:
  default: all
  settings:
    depguard:
      rules:
        Main:
          files:
            - $all
            - "!**/tools/schemaexamples/**"
            - "!**/tools/schemalinks/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/example/your-service-go
        SchemaExamples:
          files:
            - "**/tools/schemaexamples/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/santhosh-tekuri/jsonschema/v6
            - gopkg.in/yaml.v3
        SchemaLinks:
          files:
            - "**/tools/schemalinks/**"
          list-mode: strict
          allow:
            - $gostd
            - gopkg.in/yaml.v3
  exclusions:
    generated: strict

formatters:
  enable:
    - gofmt
