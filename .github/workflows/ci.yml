name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Lint (all linters)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          only-new-issues: false
          args: --timeout=5m
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Validate canonical schema examples
        run: make schema-examples
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files -- '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
  api-compatibility:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      COMPAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      PUBLIC_MODULE: github.com/example/your-service-go
      PUBLIC_PACKAGES: '.,httpclient'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Report public API compatibility
        run: go run ./tools/compatibility -policy report -base "$COMPAT_BASE" -module "$PUBLIC_MODULE" -packages "$PUBLIC_PACKAGES"
